<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spelerslijst</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#f0b429; --ink:#1d2a22; --muted:#5b6d61; }
    html, body { margin:0; background:var(--bg,#f3f7f0); color:var(--ink); font-family:Inter,Segoe UI,sans-serif; }
    .box { padding:18px; }
    .kicker { letter-spacing:.08em; text-transform:uppercase; font-size:11px; color:var(--gold); margin:0 0 6px; }
    h1 { margin:0 0 14px; font-size:24px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 6px; border-bottom:1px solid rgba(22,53,36,.08); }
    th { color:var(--muted); font-size:12px; font-weight:500; }
    .muted { color:var(--muted); }
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker" id="club">SC De Merodesnookers</p>
    <h1>Spelerslijst</h1>
    <table>
      <thead><tr><th>#</th><th>Speler</th><th>W</th><th>L</th><th>F+</th><th>F-</th><th>M%</th><th>F%</th><th>HB</th><th>Gem.</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="/webhost/snooker/theme.js"></script>
  <script>
    const BASE = location.pathname.replace(/\/live\/players\/?$/, '') || '/webhost/snooker';
    function trophy(kind) {
      if (!kind) return '';
      const fill = { gold:'#e4c25a', silver:'#c5cdd4', bronze:'#c47a3a' }[kind];
      return '<svg width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px;margin-right:4px"><path fill="'+fill+'" d="M7 3h10v2h3a1 1 0 0 1 1 1v2a5 5 0 0 1-4.1 4.9A6 6 0 0 1 13 16.9V18h3v2H8v-2h3v-1.1A6 6 0 0 1 7.1 12.9 5 5 0 0 1 3 8V6a1 1 0 0 1 1-1h3z"/></svg>';
    }
    async function refresh() {
      const data = await (await fetch(BASE + '/api/public/players')).json();
      if (window.SnookerTheme) window.SnookerTheme.apply(data.brand);
      document.getElementById('club').textContent = data.brand.clubName;
      document.getElementById('rows').innerHTML = (data.players || []).map((p) =>
        '<tr><td>' + p.rank + '</td><td>' + trophy(p.trophy) + p.name +
        '</td><td>' + p.wins + '</td><td>' + p.losses +
        '</td><td>' + p.framesFor + '</td><td>' + p.framesAgainst +
        '</td><td>' + Number(p.matchPct != null ? p.matchPct : p.winRate || 0).toFixed(2).replace('.', ',') + '%' +
        '</td><td>' + Number(p.framePct || 0).toFixed(2).replace('.', ',') + '%' +
        '</td><td>' + (p.highestBreak || '—') +
        '</td><td>' + (p.framesPlayed && p.avgPoints != null
          ? Number(p.avgPoints).toFixed(1)
          : (p.avgFrames != null ? Number(p.avgFrames).toFixed(2).replace('.', ',') : '—')) + '</td></tr>'
      ).join('') || '<tr><td colspan="10" class="muted">Nog geen spelers.</td></tr>';
    }
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
