<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clubagenda</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --accent:#2ea85a; --ink:#1d2a22; --muted:#5b6d61; --line:rgba(22,53,36,.1); }
    html, body { margin:0; background:var(--bg,#f3f7f0); color:var(--ink); font-family:Inter,Segoe UI,sans-serif; }
    .box { padding:18px; }
    .kicker { letter-spacing:.08em; text-transform:uppercase; font-size:11px; color:#b45309; margin:0 0 6px; }
    h1 { margin:0; font-size:24px; font-family:Nunito,Inter,sans-serif; }
    .bar { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:14px; }
    button { appearance:none; border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 10px; cursor:pointer; font:inherit; }
    .weekdays, .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .weekdays span { text-align:center; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; }
    .day { min-height:68px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px; }
    .day.empty { visibility:hidden; }
    .day.today { background:#e8f8ee; box-shadow:inset 0 0 0 2px var(--accent); }
    .day strong { display:block; font-size:12px; }
    .day small { display:block; color:var(--muted); font-size:11px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .row { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
    .kind { display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; margin-right:6px; background:#d9f5e3; color:#14532d; }
    .kind.toernooi { background:#fff3c4; color:#7a5200; }
    .kind.les { background:#dcecff; color:#184e77; }
    .muted { color:var(--muted); }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-top:12px; }
  </style>
</head>
<body>
  <div class="box">
    <p class="kicker" id="club">Snookerclub</p>
    <div class="bar">
      <h1 id="label">Clubagenda</h1>
      <div>
        <button type="button" id="prev">Vorige</button>
        <button type="button" id="next">Volgende</button>
      </div>
    </div>
    <div class="weekdays" id="weekdays"></div>
    <div class="grid" id="grid"></div>
    <div class="card" id="list"></div>
  </div>
  <script src="/webhost/snooker/theme.js"></script>
  <script>
    const BASE = location.pathname.replace(/\/live\/agenda\/?$/, '') || '/webhost/snooker';
    let cursor = {};
    function when(event) {
      const time = [event.start, event.end].filter(Boolean).join('–');
      return time ? event.date + ' · ' + time : event.date;
    }
    async function refresh(year, month) {
      const query = year && month ? ('?year=' + year + '&month=' + month) : '';
      const data = await (await fetch(BASE + '/api/public/agenda' + query)).json();
      if (window.SnookerTheme) window.SnookerTheme.apply(data.brand);
      const agenda = data.agenda || {};
      cursor = { year: agenda.year, month: agenda.month };
      document.getElementById('club').textContent = data.brand?.clubName || 'Snookerclub';
      document.getElementById('label').textContent = agenda.label || 'Clubagenda';
      document.getElementById('weekdays').innerHTML = (agenda.weekdays || []).map((d) => '<span>' + d + '</span>').join('');
      document.getElementById('grid').innerHTML = (agenda.days || []).map((day) => {
        if (day.empty) return '<div class="day empty"></div>';
        const first = (day.events || [])[0];
        return '<div class="day' + (day.today ? ' today' : '') + '"><strong>' + day.day + '</strong>' +
          (first ? '<small>' + first.title + '</small>' : '') +
          (day.events.length > 1 ? '<small>+' + (day.events.length - 1) + '</small>' : '') + '</div>';
      }).join('');
      function esc(value) {
        return String(value || '').replace(/[&<>"']/g, function (ch) {
          return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch];
        });
      }
      const monthEvents = agenda.events || [];
      const next = (agenda.upcoming || [])[0];
      document.getElementById('list').innerHTML = (next ? '<p class="muted">Volgende: ' + esc(next.title) + ' · ' + esc(next.date) + (next.start ? ' · ' + esc(next.start) : '') + '</p>' : '') +
        (monthEvents.length
          ? monthEvents.map((event) => '<div class="row"><div><span class="kind ' + esc(event.kind) + '">' +
            esc(event.kindLabel || event.kind) + '</span><strong>' + esc(event.title) + '</strong><div class="muted">' +
            esc(when(event)) + (event.place ? ' · ' + esc(event.place) : '') + '</div></div></div>').join('')
          : '<p class="muted">Nog geen clubavonden of events deze maand.</p>');
    }
    document.getElementById('prev').onclick = () => {
      const date = new Date(cursor.year, cursor.month - 2, 1);
      refresh(date.getFullYear(), date.getMonth() + 1);
    };
    document.getElementById('next').onclick = () => {
      const date = new Date(cursor.year, cursor.month, 1);
      refresh(date.getFullYear(), date.getMonth() + 1);
    };
    refresh();
    setInterval(() => refresh(cursor.year, cursor.month), 30000);
  </script>
</body>
</html>
