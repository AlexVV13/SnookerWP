services:
  snooker:
    build:
      context: .
      args:
        APP_VERSION: "1.0.5"
        APP_REVISION: "${APP_REVISION:-local}"
        BUILD_DATE: "${BUILD_DATE:-}"
    image: webhost-snooker:1.0.5
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      PORT: "9091"
      HOST: "0.0.0.0"
      NODE_ENV: production
      WEBHOST_BASE_PATH: "/webhost/snooker"
      SNOOKER_DATA_DIR: "/app/data"
      APP_VERSION: "1.0.5"
      APP_REVISION: "${APP_REVISION:-local}"
      BUILD_DATE: "${BUILD_DATE:-}"
      TZ: Europe/Amsterdam
      CLUB_TZ: Europe/Amsterdam
    volumes:
      - snooker-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9091/webhost/snooker/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s

volumes:
  snooker-data:
